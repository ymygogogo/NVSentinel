replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/nvidia/nvsentinel/event-exporter
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations: {}

# Timezone used by the event-exporter process logs.
timezone: "UTC"

resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# OIDC secret configuration
# The secret should contain a key named 'oidc-client-secret'
# You must create this secret manually before deploying this chart
oidcSecretName: "event-exporter-oidc-secret"

# MongoDB TLS client certificate mount path.
# Default is /etc/ssl/mongo-client for internal MongoDB (mTLS).
# Override to "" in your CSP-specific values file when using managed services
# (Atlas, DocumentDB with SCRAM, Cosmos DB) that do not require client certificates.
mongodbStore:
  clientCertMountPath: /etc/ssl/mongo-client

# Event exporter configuration
exporter:
  # Unique change stream client name used for resume token storage.
  # Use a different value for each independent event-exporter deployment.
  clientName: "event-exporter"

  # Metadata configuration
  # Add any custom metadata fields here - they will be included in CloudEvents data.metadata
  metadata:
    cluster: "my-cluster"
    environment: "production"
    # Additional custom metadata fields (optional):
    # region: "us-west-2"
    # datacenter: "dc01"
    # tenant: "acme-corp"

  # Sink configuration for event destination
  sink:
    type: "http" # http | kafka
    endpoint: "https://events.example.com/api/v1/events"
    timeout: "30s"
    insecureSkipVerify: false
    kafka:
      brokers: []
      topic: ""
      clientId: "event-exporter"
      requiredAcks: "all" # none | leader | all
      compression: "snappy" # none | gzip | snappy | lz4 | zstd
      batchTimeout: "10ms"
      writeTimeout: "30s"
      payloadFormat: "cloudevent" # cloudevent | wrapped
      wrapper:
        eventType: "nvsentinel_health_event"
        resourceId: ""
        resourceStatus: ""
        resourceSubStatus: ""
        extraRawField: "raw"
      tls:
        enabled: false
        secretName: ""
        mountPath: "/etc/kafka-tls"
        caFile: ""
        certFile: ""
        keyFile: ""
        insecureSkipVerify: false
      sasl:
        enabled: false
        secretName: ""
        mountPath: "/etc/kafka-auth"
        mechanism: "SCRAM-SHA-512" # PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
        username: ""
        passwordFile: ""

  # OIDC configuration for authentication
  oidc:
    enabled: false
    tokenUrl: "https://auth.example.com/oauth2/token"
    clientId: "nvsentinel-exporter"
    scope: "events:write"
    insecureSkipVerify: false

  # Backfill configuration for historical events
  backfill:
    enabled: true
    maxAge: "720h"       # 30 days
    maxEvents: 1000000
    batchSize: 500
    rateLimit: 1000      # events per second

  # Resume token storage configuration
  resumeToken:
    database: "nvsentinel"
    collection: "resumetokens"

  # Number of concurrent publish workers.
  # Each worker publishes events to the sink in parallel.
  # Higher values increase throughput for high-event-rate clusters.
  # At 300ms per publish, 10 workers ≈ 33 events/sec throughput.
  workers: 10

  # Failure handling and retry configuration
  failureHandling:
    maxRetries: 17           # ~30 minutes of retries
    initialBackoff: "1s"
    maxBackoff: "5m"
    backoffMultiplier: 2.0


  # Optional enrichment pipeline for adding Pod business context to exported events.
  # Disabled by default to preserve existing payloads and RBAC.
  enrichment:
    enabled: false
    failurePolicy: "best_effort" # best_effort | require_pod_context
    currentCacheMaxEventAge: "5m"
    clockSkewTolerance: "2m"

    podMetadata:
      enabled: false
      realtimeSource: "kubernetes-watch-cache"
      realtimeFallbackSource: "prometheus"
      historicalSource: "prometheus"
      namespaceIncludeRegex: ""
      namespaceExcludeRegex: "^(kube-system|nvsentinel|gpu-operator|monitoring)$"
      labelSelector: ""
      labelAllowlist:
        - tenant_id
        - user_id
        - task_id
        - job_id
        - workspace_id
      annotationAllowlist: []
      maxPodsPerNode: 1000
      maxPayloadBytes: 2097152
      cacheSyncTimeout: "10s"

    nodeMetadata:
      enabled: false
      labelAllowlist: []
      cacheSyncTimeout: "10s"

    prometheus:
      enabled: false
      endpoint: "http://prometheus.monitoring.svc:9090"
      timeout: "3s"
      queryLookback: "5m"
      queryRangeStep: "30s"
      # Optional Go template for Prometheus pod lookup queries.
      # Available variables: .NodeName, .QueryLookback, .GroupLeftLabels, .GroupLeftAnnotations.
      queryTemplate: ""
      maxConcurrentQueries: 5
      cacheTTL: "60s"

    missingPodContextAlert:
      enabled: false
      webhookURL: ""
      timeout: "3s"
      maxRetries: 2
