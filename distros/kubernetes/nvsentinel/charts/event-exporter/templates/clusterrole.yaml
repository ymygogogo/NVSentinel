{{- if eq (include "event-exporter.kubernetesWatchEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "event-exporter.fullname" . }}
  labels:
    {{- include "event-exporter.labels" . | nindent 4 }}
rules:
{{- if eq (include "event-exporter.podWatchEnabled" .) "true" }}
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- if eq (include "event-exporter.nodeWatchEnabled" .) "true" }}
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- end }}
