apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "event-exporter.fullname" . }}
  labels:
    {{- include "event-exporter.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.toml: |
    [exporter]
    client_name = "{{ .Values.exporter.clientName }}"

    [exporter.metadata]
    {{- range $key, $value := .Values.exporter.metadata }}
    {{- if $value }}
    {{ $key }} = "{{ $value }}"
    {{- end }}
    {{- end }}

    [exporter.sink]
    type = "{{ .Values.exporter.sink.type | default "http" }}"
    endpoint = "{{ .Values.exporter.sink.endpoint }}"
    timeout = "{{ .Values.exporter.sink.timeout }}"
    insecure_skip_verify = {{ .Values.exporter.sink.insecureSkipVerify }}

    [exporter.sink.kafka]
    brokers = [{{- range $i, $broker := .Values.exporter.sink.kafka.brokers }}{{ if $i }}, {{ end }}"{{ $broker }}"{{- end }}]
    topic = "{{ .Values.exporter.sink.kafka.topic }}"
    client_id = "{{ .Values.exporter.sink.kafka.clientId }}"
    required_acks = "{{ .Values.exporter.sink.kafka.requiredAcks }}"
    compression = "{{ .Values.exporter.sink.kafka.compression }}"
    batch_timeout = "{{ .Values.exporter.sink.kafka.batchTimeout }}"
    write_timeout = "{{ .Values.exporter.sink.kafka.writeTimeout }}"
    payload_format = "{{ .Values.exporter.sink.kafka.payloadFormat }}"

    [exporter.sink.kafka.wrapper]
    event_type = "{{ .Values.exporter.sink.kafka.wrapper.eventType }}"
    resource_id = "{{ .Values.exporter.sink.kafka.wrapper.resourceId }}"
    resource_status = "{{ .Values.exporter.sink.kafka.wrapper.resourceStatus }}"
    resource_sub_status = "{{ .Values.exporter.sink.kafka.wrapper.resourceSubStatus }}"
    extra_raw_field = "{{ .Values.exporter.sink.kafka.wrapper.extraRawField }}"

    [exporter.sink.kafka.tls]
    enabled = {{ .Values.exporter.sink.kafka.tls.enabled }}
    ca_file = "{{ .Values.exporter.sink.kafka.tls.caFile }}"
    cert_file = "{{ .Values.exporter.sink.kafka.tls.certFile }}"
    key_file = "{{ .Values.exporter.sink.kafka.tls.keyFile }}"
    insecure_skip_verify = {{ .Values.exporter.sink.kafka.tls.insecureSkipVerify }}

    [exporter.sink.kafka.sasl]
    enabled = {{ .Values.exporter.sink.kafka.sasl.enabled }}
    mechanism = "{{ .Values.exporter.sink.kafka.sasl.mechanism }}"
    username = "{{ .Values.exporter.sink.kafka.sasl.username }}"
    password_file = "{{ .Values.exporter.sink.kafka.sasl.passwordFile }}"

    [exporter.oidc]
    enabled = {{ .Values.exporter.oidc.enabled }}
    token_url = "{{ .Values.exporter.oidc.tokenUrl }}"
    client_id = "{{ .Values.exporter.oidc.clientId }}"
    scope = "{{ .Values.exporter.oidc.scope }}"
    insecure_skip_verify = {{ .Values.exporter.oidc.insecureSkipVerify }}

    [exporter.backfill]
    enabled = {{ .Values.exporter.backfill.enabled }}
    max_age = "{{ .Values.exporter.backfill.maxAge }}"
    max_events = {{ .Values.exporter.backfill.maxEvents | int }}
    batch_size = {{ .Values.exporter.backfill.batchSize | int }}
    rate_limit = {{ .Values.exporter.backfill.rateLimit | int }}

    [exporter.resume_token]
    database = "{{ .Values.exporter.resumeToken.database }}"
    collection = "{{ .Values.exporter.resumeToken.collection }}"

    [exporter.failure_handling]
    max_retries = {{ .Values.exporter.failureHandling.maxRetries | int }}
    initial_backoff = "{{ .Values.exporter.failureHandling.initialBackoff }}"
    max_backoff = "{{ .Values.exporter.failureHandling.maxBackoff }}"
    backoff_multiplier = {{ .Values.exporter.failureHandling.backoffMultiplier }}


    [exporter.enrichment]
    enabled = {{ .Values.exporter.enrichment.enabled }}
    failure_policy = "{{ .Values.exporter.enrichment.failurePolicy }}"
    current_cache_max_event_age = "{{ .Values.exporter.enrichment.currentCacheMaxEventAge }}"
    clock_skew_tolerance = "{{ .Values.exporter.enrichment.clockSkewTolerance }}"

    [exporter.enrichment.pod_metadata]
    enabled = {{ .Values.exporter.enrichment.podMetadata.enabled }}
    realtime_source = "{{ .Values.exporter.enrichment.podMetadata.realtimeSource }}"
    realtime_fallback_source = "{{ .Values.exporter.enrichment.podMetadata.realtimeFallbackSource }}"
    historical_source = "{{ .Values.exporter.enrichment.podMetadata.historicalSource }}"
    namespace_include_regex = "{{ .Values.exporter.enrichment.podMetadata.namespaceIncludeRegex }}"
    namespace_exclude_regex = "{{ .Values.exporter.enrichment.podMetadata.namespaceExcludeRegex }}"
    label_selector = "{{ .Values.exporter.enrichment.podMetadata.labelSelector }}"
    label_allowlist = [{{- range $i, $label := .Values.exporter.enrichment.podMetadata.labelAllowlist }}{{ if $i }}, {{ end }}"{{ $label }}"{{- end }}]
    annotation_allowlist = [{{- range $i, $annotation := .Values.exporter.enrichment.podMetadata.annotationAllowlist }}{{ if $i }}, {{ end }}"{{ $annotation }}"{{- end }}]
    max_pods_per_node = {{ .Values.exporter.enrichment.podMetadata.maxPodsPerNode | int }}
    max_payload_bytes = {{ .Values.exporter.enrichment.podMetadata.maxPayloadBytes | int }}
    cache_sync_timeout = "{{ .Values.exporter.enrichment.podMetadata.cacheSyncTimeout }}"

    [exporter.enrichment.prometheus]
    enabled = {{ .Values.exporter.enrichment.prometheus.enabled }}
    endpoint = "{{ .Values.exporter.enrichment.prometheus.endpoint }}"
    timeout = "{{ .Values.exporter.enrichment.prometheus.timeout }}"
    query_lookback = "{{ .Values.exporter.enrichment.prometheus.queryLookback }}"
    query_template = {{ .Values.exporter.enrichment.prometheus.queryTemplate | quote }}
    max_concurrent_queries = {{ .Values.exporter.enrichment.prometheus.maxConcurrentQueries | int }}
    cache_ttl = "{{ .Values.exporter.enrichment.prometheus.cacheTTL }}"

    [exporter.enrichment.missing_pod_context_alert]
    enabled = {{ .Values.exporter.enrichment.missingPodContextAlert.enabled }}
    webhook_url = "{{ .Values.exporter.enrichment.missingPodContextAlert.webhookURL }}"
    timeout = "{{ .Values.exporter.enrichment.missingPodContextAlert.timeout }}"
    max_retries = {{ .Values.exporter.enrichment.missingPodContextAlert.maxRetries | int }}
